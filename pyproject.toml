[project]
name = "nautilus-compact-list"
version = "0.1.0"
description = "Classic Nautilus-style Compact List view with variable-width columns for GNOME Files (Nautilus)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402"]

